name: CI (manual)

on:
  # Automatic runs are temporarily disabled because GitHub Actions is locked
  # for the BAITC-Hacks organization at the billing level. Re-enable push and
  # pull_request triggers when the organization owner restores Actions access.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py services utils

      - name: Run unit and UI smoke tests
        run: python -m unittest discover -s tests -v
